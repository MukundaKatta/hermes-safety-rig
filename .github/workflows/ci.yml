name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # The runtime "primitives" (agentvet/agentguard/agentcast) are referenced
      # in pyproject as stand-ins; the in-repo reference implementation is pure
      # stdlib, so we install the package without those deps to keep CI green.
      - name: Install package (no external deps)
        run: python -m pip install --no-deps -e .

      - name: Install test tooling
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -q
